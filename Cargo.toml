[package]
name = "fly-kit"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "process",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.89"
